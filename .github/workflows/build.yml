name: Build TurboFPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build production JAR
        run: gradle build --no-daemon --stacktrace

      - name: Prepare direct JAR
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" build/libs/TurboFPS.jar
          echo "Built: build/libs/TurboFPS.jar"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboFPS-JAR
          path: build/libs/TurboFPS.jar
          if-no-files-found: error

      - name: Publish direct JAR release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "TurboFPS build ${{ github.run_number }}"
          generate_release_notes: true
          files: build/libs/TurboFPS.jar
