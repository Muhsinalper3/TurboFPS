name: Build TurboFPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Locate distributable JAR
        shell: bash
        run: |
          echo "Built JAR files:"
          find build -type f -name '*.jar' -print
          mkdir -p dist
          jar_file="$(find build -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar_file"
          cp "$jar_file" dist/TurboFPS-1.0.0.jar
          ls -lh dist/TurboFPS-1.0.0.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TurboFPS-1.0.0-Minecraft-26.2
          path: dist/TurboFPS-1.0.0.jar
          if-no-files-found: error
